replicaCount: 1

image:
  repository: k8s-incident-responder
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

env:
  OPENAI_API_KEY: ""
  OPENAI_MODEL: "gpt-4o-mini"
  SLACK_WEBHOOK_URL: ""
  DATABASE_URL: "sqlite+aiosqlite:///./incidents.db"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

serviceAccount:
  create: true
  name: "incident-responder"

rbac:
  create: true
