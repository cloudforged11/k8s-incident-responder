services:
  - type: web
    name: k8s-incident-responder
    runtime: docker
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./incidents.db
      - key: SLACK_WEBHOOK_URL
        value: ""
